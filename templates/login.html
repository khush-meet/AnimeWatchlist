<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniTrack - Login</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1115; color: #e8eaf0; font-family: system-ui, sans-serif; }
  form { background: #181b22; border: 1px solid #2a2f3a; border-radius: 16px; padding: 28px;
         width: 320px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0 0 4px; } h1 span { color: #7c5cff; }
  p { margin: 0; color: #9097a6; font-size: 14px; }
  input, button { padding: 11px 12px; border-radius: 10px; border: 1px solid #2a2f3a;
                  background: #20242d; color: #e8eaf0; font-size: 15px; }
  button { cursor: pointer; } button.main { background: #7c5cff; border-color: #7c5cff; font-weight: 600; }
  .err { color: #ff6b6b; font-size: 14px; }
</style>
</head>
<body>
<form method="post">
  <h1>Ani<span>Track</span></h1>
  <p>Log in, or pick a username and password to create an account.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="Username" autocomplete="username" required autofocus>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="main" name="action" value="login">Log in</button>
  <button name="action" value="register">Create account</button>
</form>
</body>
</html>
